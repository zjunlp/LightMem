services:
  structmem:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTORCH_WHEEL_URL: ${PYTORCH_WHEEL_URL:-https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp311-cp311-linux_x86_64.whl}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    image: structmem-raw-hybrid:0.3.0
    ports:
      - "8000:8000"
    environment:
      MEMORY_DATA_DIR: /data
      MEMORY_API_KEY: ${MEMORY_API_KEY:-}
      MEMORY_EMBEDDING_PROVIDER: ${MEMORY_EMBEDDING_PROVIDER:-sentence_transformers}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      MEMORY_LOCAL_EMBEDDING_MODEL: ${MEMORY_LOCAL_EMBEDDING_MODEL:-/opt/models/bge-m3}
      MEMORY_LOCAL_EMBEDDING_REVISION: ${MEMORY_LOCAL_EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      MEMORY_OPENAI_EMBEDDING_MODEL: ${MEMORY_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MEMORY_EMBEDDING_DEVICE: ${MEMORY_EMBEDDING_DEVICE:-cpu}
      MEMORY_LEXICAL_WEIGHT: ${MEMORY_LEXICAL_WEIGHT:-0.1}
      MEMORY_EMBED_SPEAKERS: ${MEMORY_EMBED_SPEAKERS:-true}
      MEMORY_MULTI_WINDOW: ${MEMORY_MULTI_WINDOW:-false}
      MEMORY_FUSION: ${MEMORY_FUSION:-}
      MEMORY_CJK_LEXICAL_WEIGHT: ${MEMORY_CJK_LEXICAL_WEIGHT:-0.5}
      MEMORY_CJK_CORPUS_RATIO_THRESHOLD: ${MEMORY_CJK_CORPUS_RATIO_THRESHOLD:-0.05}
      MEMORY_EMBED_TIMESTAMPS: ${MEMORY_EMBED_TIMESTAMPS:-false}
      MEMORY_SESSION_DIVERSITY: ${MEMORY_SESSION_DIVERSITY:-false}
      MEMORY_SESSION_RANK_DECAY: ${MEMORY_SESSION_RANK_DECAY:-0.5}
      MEMORY_SESSION_RECENCY_WEIGHT: ${MEMORY_SESSION_RECENCY_WEIGHT:-0}
      MEMORY_SESSION_ANCHOR_SEED_K: ${MEMORY_SESSION_ANCHOR_SEED_K:-0}
      MEMORY_SESSION_REPEAT_PENALTY: ${MEMORY_SESSION_REPEAT_PENALTY:-0}
      MEMORY_RRF_K: ${MEMORY_RRF_K:-60}
      MEMORY_RESULT_WINDOW: ${MEMORY_RESULT_WINDOW:-0}
      MEMORY_RESULT_WINDOW_SEED_K: ${MEMORY_RESULT_WINDOW_SEED_K:-20}
      MEMORY_SEMANTIC_BRIDGE_SEED_K: ${MEMORY_SEMANTIC_BRIDGE_SEED_K:-0}
      MEMORY_SEMANTIC_BRIDGE_MIN_SIMILARITY: ${MEMORY_SEMANTIC_BRIDGE_MIN_SIMILARITY:-0.72}
    volumes:
      - structmem-bgem3-data:/data
    restart: unless-stopped

volumes:
  structmem-bgem3-data:
